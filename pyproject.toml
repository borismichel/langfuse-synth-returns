[project]
name = "returns"
version = "0.1.0"
description = "Returns Desk demo kit. v1 deducts a returns label; v2 is a checklist plus a calculator."
requires-python = ">=3.11"
dependencies = [
    # Pinned to langfuse-synth-core v5.2.0. Keep this extra and the authoring extra on the same tag.
    "langfuse-synth-core[companion] @ git+https://github.com/borismichel/langfuse-synth-core@v5.2.0",
    "langfuse>=5.1.0,<6",
    "anthropic==1.11.0",
    "PyYAML>=6,<7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
    # Same tag as the runtime pin above. Bump both together.
    "langfuse-synth-core[authoring] @ git+https://github.com/borismichel/langfuse-synth-core@v5.2.0",
]

[project.scripts]
synth = "synth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synth = ["history_assets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
